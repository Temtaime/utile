name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest ]
        compiler: [ ldc-1.41, dmd-2.111 ]

    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - run: dub test :test

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ] # FIXME : there's no ubuntu-latest-arm
        compiler: [ ldc2, dmd ]
        exclude:
        - os: ubuntu-24.04-arm
          compiler: dmd

    runs-on: ${{ matrix.os }}
    container: alpine

    steps:
      - uses: laverdet/alpine-arm64@v1
      - uses: actions/checkout@v4

      - run: |
          apk update
          apk add dub clang llvm lld           # build tools
          apk add gcc libc++-static            # runtime
          apk add zlib-static linux-headers    # deps

          apk add $(echo ${{ matrix.compiler }} | tr -d '0-9') # compiler

      - run: dub test :test --compiler=${{ matrix.compiler }}

  release:
    runs-on: ubuntu-latest
    needs: [ build, build-linux ]

    steps:
      - uses: actions/checkout@v4

      - uses: anothrNick/github-tag-action@1.75.0
        id: create_tag
        env:
          TAG_PREFIX: v
          DEFAULT_BUMP: none
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.create_tag.outputs.new_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      #- run: curl -s -X POST ${{ secrets.WEBHOOK_URL }}
