name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, ubuntu-24.04-arm ] # FIXME : there's no ubuntu-latest-arm
        dub_compiler: [ ldc, dmd ]
        exclude:
        - os: ubuntu-24.04-arm
          dub_compiler: dmd

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ${{ matrix.dub_compiler }}-latest

      - run: dub test -b unittest

  build-linux-musl:
    runs-on: ubuntu-24.04-arm # FIXME : there's no ubuntu-latest-arm
    container: alpine

    steps:
      - uses: laverdet/alpine-arm64@v1

      - uses: actions/checkout@v4

      - run: |
          apk add ldc dub
          DUB_UTILE_MUSL=_musl dub test -b unittest

  release:
    runs-on: ubuntu-latest
    needs: [ build, build-linux-musl ]
    if: "!contains(github.event.head_commit.message, 'WIP')"

    steps:
      - uses: actions/checkout@v2

      - uses: anothrNick/github-tag-action@1.35.0
        id: create_tag
        env:
          WITH_V: true
          DEFAULT_BUMP: patch
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.create_tag.outputs.new_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
